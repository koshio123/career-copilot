name: frontend

on:
  push:
    branches: [main]
    paths:
      ["frontend/**", "backend/openapi.json", ".github/workflows/frontend.yml"]
  pull_request:
    paths:
      ["frontend/**", "backend/openapi.json", ".github/workflows/frontend.yml"]

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # working-directory only affects run: steps, not action inputs, and
          # there is no root package.json — point at the frontend one.
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API types in sync with backend/openapi.json
        run: |
          pnpm run gen:api
          git diff --exit-code src/api/schema.ts

      - name: ESLint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Prettier check
        run: pnpm run format:check

      - name: Unit tests
        run: pnpm run test

      - name: Production build
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
