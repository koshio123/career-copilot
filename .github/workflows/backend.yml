name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: career
          POSTGRES_PASSWORD: career
          POSTGRES_DB: career_copilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U career -d career_copilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: local
      APP_DATABASE_URL: postgresql+asyncpg://career:career@localhost:5432/career_copilot_test
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies
        run: uv sync --extra worker

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy .

      - name: pytest
        run: uv run pytest --cov=app --cov-report=term-missing
