name: infra

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/

      - name: terraform validate (per root module)
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          while IFS= read -r dir; do
            if compgen -G "$dir/*.tf" > /dev/null; then
              found=1
              echo "::group::validate $dir"
              terraform -chdir="$dir" init -backend=false -input=false
              terraform -chdir="$dir" validate
              echo "::endgroup::"
            fi
          done < <(find infra -type d)
          if [ "$found" -eq 0 ]; then
            echo "No Terraform root modules yet — skipping validate."
          fi
