# Enable with:  uvx pre-commit install   (or: pipx install pre-commit && pre-commit install)
# Refresh pins: uvx pre-commit autoupdate
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(pnpm-lock\.yaml|.*/uv\.lock)$

  # Project toolchains run via their own pinned versions (uv / pnpm), so there is
  # nothing to keep in sync here.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, backend)
        entry: bash -c 'cd backend && uv run ruff check --fix .'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: ruff-format
        name: ruff (format, backend)
        entry: bash -c 'cd backend && uv run ruff format .'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: mypy
        name: mypy (backend, strict)
        entry: bash -c 'cd backend && uv run mypy .'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && pnpm run lint'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|js)$

      - id: prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && pnpm run format:check'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|js|json|css|html|md)$

      - id: terraform-fmt
        name: terraform fmt
        entry: bash -c 'terraform fmt -check -recursive infra/'
        language: system
        pass_filenames: false
        files: ^infra/.*\.tf$
