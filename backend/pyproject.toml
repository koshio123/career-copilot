[project]
name = "career-copilot-backend"
version = "0.0.0"
description = "Career Copilot backend API and async workers"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "httpx>=0.28",
    "boto3>=1.35",       # DynamoDB (sessions / OTP / rate limits) + SES
    "aiosmtplib>=3.0",   # async SMTP for local mail delivery
]

[project.optional-dependencies]
# Async worker runtime (Phase 04+). Kept out of the API image.
worker = [
    "anthropic>=0.40",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "trafilatura>=2.0",
    "selectolax>=0.3.25",
    "protego>=0.3",
]
# Headless browser for JS-rendered crawl targets (Phase 06). Runs on Fargate,
# never bundled into a Lambda zip.
browser = [
    "playwright>=1.48",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "moto[dynamodb]>=5.0",
    "boto3-stubs[dynamodb]>=1.35",
]

[tool.uv]
# This is an application, not a distributable package: manage the environment,
# don't build/install the project itself.
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated; keep them formatted but don't nitpick.
"alembic/versions/*.py" = ["E501"]
# conftest sets test env vars before importing app modules that read settings.
"tests/conftest.py" = ["E402"]
# deliberately exercises full-width / ambiguous characters in normalisation.
"tests/test_jobs_normalize.py" = ["RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic", "scripts"]
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["trafilatura.*", "selectolax.*", "protego.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Alembic's env.py uses a dynamically-typed API.
module = ["alembic.env"]
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
# boto3 resources/clients are effectively untyped at the call sites we use.
module = ["app.core.aws"]
warn_return_any = false
disallow_any_explicit = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session so the session-scoped DB engine and the
# per-test sessions share it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
